name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/lead-generation-foundation
      - feature/espocrm-foss-crm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Next.js application
        run: npm run build
